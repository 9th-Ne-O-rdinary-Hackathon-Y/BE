spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://localhost:5432/
    username: postgres
    password: neodinary1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update         # 운영 환경에서는 none 권장
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: true